<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - ToonFlix Hindi</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Admin specific styles */
        .admin-container {
            max-width: 800px;
            margin: 50px auto;
            padding: 30px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            border-radius: 25px;
            border: 1px solid rgba(0, 212, 255, 0.1);
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }
        .login-box {
            text-align: center;
            padding: 40px 20px;
        }
        .login-box input {
            padding: 14px 20px;
            width: 280px;
            background: rgba(0, 0, 0, 0.3);
            border: 2px solid rgba(0, 212, 255, 0.2);
            border-radius: 30px;
            color: white;
            font-size: 16px;
            outline: none;
            transition: border 0.3s;
        }
        .login-box input:focus {
            border-color: #00d4ff;
        }
        .login-box button {
            padding: 14px 35px;
            background: linear-gradient(135deg, #00d4ff, #7b2ffc);
            border: none;
            border-radius: 30px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            margin-left: 10px;
            transition: transform 0.3s;
        }
        .login-box button:hover {
            transform: scale(1.05);
        }
        .admin-content {
            display: none;
        }
        .admin-content.active {
            display: block;
        }
        .form-group {
            margin: 18px 0;
        }
        .form-group label {
            display: block;
            color: #8899bb;
            margin-bottom: 6px;
            font-weight: 500;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 12px 16px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 12px;
            color: white;
            font-size: 15px;
            outline: none;
            transition: border 0.3s;
        }
        .form-group input:focus, .form-group select:focus {
            border-color: #00d4ff;
        }
        .form-group select option {
            background: #1a1a3e;
        }
        .btn-save {
            background: linear-gradient(135deg, #00d4ff, #7b2ffc);
            color: white;
            padding: 14px 35px;
            border: none;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.3s;
            margin-top: 10px;
        }
        .btn-save:hover {
            transform: scale(1.05);
        }
        .btn-delete {
            background: rgba(255, 0, 0, 0.2);
            color: #ff6b6b;
            padding: 8px 18px;
            border: 1px solid rgba(255,0,0,0.2);
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-delete:hover {
            background: rgba(255, 0, 0, 0.3);
        }
        .anime-item {
            background: rgba(0, 0, 0, 0.2);
            padding: 15px 20px;
            margin: 12px 0;
            border-radius: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(255,255,255,0.03);
            flex-wrap: wrap;
            gap: 10px;
        }
        .anime-item .info {
            flex: 1;
        }
        .anime-item span {
            color: #eef5ff;
        }
        .badge {
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            margin-left: 10px;
        }
        .badge-ongoing {
            background: rgba(0, 212, 255, 0.2);
            color: #00d4ff;
        }
        .badge-completed {
            background: rgba(123, 47, 252, 0.2);
            color: #7b2ffc;
        }
        hr {
            border: none;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(0,212,255,0.2), transparent);
            margin: 30px 0;
        }
        .logout-btn {
            background: rgba(255, 0, 0, 0.15);
            color: #ff6b6b;
            padding: 10px 25px;
            border: 1px solid rgba(255,0,0,0.15);
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .logout-btn:hover {
            background: rgba(255, 0, 0, 0.25);
        }
        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #00d4ff;
            text-decoration: none;
        }
        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="admin-container">
        <a href="index.html" class="back-link">⬅ Back to Website</a>

        <!-- Login Section -->
        <div id="loginSection" class="login-box">
            <h2 style="color:#eef5ff;">🔐 Admin Login</h2>
            <input type="password" id="adminPass" placeholder="Enter Password">
            <button onclick="verifyAdmin()">Login</button>
            <p style="color: #445566; margin-top: 20px; font-size: 14px;">Default: <strong style="color:#00d4ff;">admin123</strong></p>
        </div>

        <!-- Admin Content -->
        <div id="adminContent" class="admin-content">
            <h2 style="color:#eef5ff;">⚙️ Admin Panel</h2>
            <p style="color:#8899bb;">Manage your anime catalogue</p>
            <hr>

            <h3 style="color:#eef5ff;">➕ Add New Anime</h3>
            <div class="form-group">
                <label>Anime Title</label>
                <input type="text" id="animeTitle" placeholder="e.g., Naruto">
            </div>
            <div class="form-group">
                <label>Poster URL</label>
                <input type="text" id="animePoster" placeholder="https://example.com/poster.jpg">
            </div>
            <div class="form-group">
                <label>Status</label>
                <select id="animeStatus">
                    <option value="ongoing">Ongoing</option>
                    <option value="completed">Completed</option>
                </select>
            </div>
            <div class="form-group">
                <label>Telegram Bot Link</label>
                <input type="text" id="animeTelegram" placeholder="https://t.me/YourBot?start=anime_id">
            </div>
            <button class="btn-save" onclick="addAnime()">💾 Save Anime</button>

            <hr>

            <h3 style="color:#eef5ff;">📋 Current Anime List</h3>
            <div id="animeList"></div>

            <hr>
            <button class="logout-btn" onclick="logout()">🚪 Logout</button>
        </div>
    </div>

    <script src="admin.js"></script>
</body>
</html>
